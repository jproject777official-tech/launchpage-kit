<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Masuk — RuangWeb</title><link rel="stylesheet" href="../assets/css/console.css"><script src="../assets/js/login.js" defer></script></head><body class="console-body"><main class="login-wrap"><section class="login-card"><a class="console-brand" href="../index.html" style="color:#142d4e"><span class="console-mark">R</span> RuangWeb</a><h1>Selamat datang kembali.</h1><p>Masuk ke panel pengelolaan website Anda.</p><div id="notice" class="console-note" hidden></div><form id="login-form" class="console-form"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div><div class="field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"></div><button class="console-button primary" type="submit">Masuk ke dashboard</button></form><p class="login-foot">Akun pelanggan dibuat oleh admin RuangWeb. Jika Anda belum memiliki akun atau lupa kata sandi, hubungi admin.</p></section></main></body></html>
