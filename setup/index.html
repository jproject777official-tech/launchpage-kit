<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Setup Admin Utama — RuangWeb</title><link rel="stylesheet" href="../assets/css/console.css"><script src="../assets/js/setup.js" defer></script></head><body class="console-body"><main class="login-wrap"><section class="login-card"><a class="console-brand" href="../index.html" style="color:#142d4e"><span class="console-mark">R</span> RuangWeb</a><h1>Buat admin utama.</h1><p>Halaman ini hanya dapat membuat admin utama pertama dan memerlukan secret yang disimpan di konfigurasi Cloudflare, bukan di repository.</p><div id="notice" class="console-note" hidden></div><form id="setup-form" class="console-form"><div class="field"><label for="secret">Bootstrap secret</label><input id="secret" type="password" autocomplete="off" required></div><div class="field"><label for="fullName">Nama admin</label><input id="fullName" required maxlength="100"></div><div class="field"><label for="email">Email admin</label><input id="email" type="email" required maxlength="254"></div><div class="field"><label for="password">Kata sandi (minimal 12 karakter)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required></div><button class="console-button primary" type="submit">Buat admin utama</button></form><p class="login-foot">Setelah admin berhasil dibuat, endpoint setup akan ditutup. Hapus atau lindungi halaman ini setelah bootstrap selesai.</p></section></main></body></html>
