name = "ruangweb-platform"
compatibility_date = "2026-10-10"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "ruangweb-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Configure BOOTSTRAP_SECRET as a secret in Cloudflare Pages/Workers settings.
# Never commit BOOTSTRAP_SECRET or any customer password to this repository.
